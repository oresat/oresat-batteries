name: Generate Markdown report

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate report
        id: report
        env:
          API_KEY: ${{ secrets.API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          TZ: America/Los_Angeles
        run: |
          : "${LLM_MODEL:?Set the LLM_MODEL repository variable in GitHub Actions}"
          : "${API_KEY:?Set the API_KEY repository secret}"

          timestamp=$(date '+%Y-%m-%d_%H-%M-%S-%Z')
          filename="report-${REPO_NAME}-${timestamp}.md"

          python3 .github/report/generate.py "$RUNNER_TEMP/$filename"
          printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"

      - name: Upload Markdown report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.report.outputs.filename }}
          path: ${{ runner.temp }}/${{ steps.report.outputs.filename }}
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 30
